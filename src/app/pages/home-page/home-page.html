<main class="mx-auto max-w-6xl px-6 sm:px-10">
  <section class="border-b border-line py-16 sm:py-24" aria-labelledby="home-title">
    <p class="mb-4 text-sm text-accent">Portfólio · Crazy Lab</p>
    <h1 id="home-title" class="text-4xl font-semibold tracking-tight sm:text-6xl">
      Vinícius Lopes
    </h1>
    <p class="mt-5 max-w-xl text-base leading-relaxed text-muted sm:text-lg">
      Projetos e estudos em jogos digitais, desenvolvimento web e interação.
    </p>
  </section>

  <section id="cases" class="py-12 sm:py-16" aria-labelledby="cases-title">
    <div class="mb-8 flex flex-wrap items-center justify-between gap-4">
      <h2 id="cases-title" class="text-2xl font-semibold tracking-tight">Projetos selecionados</h2>
      <a pButton [text]="true" size="small" class="min-h-11" routerLink="/projects"
        ><span pButtonLabel>Ver todos</span><i class="pi pi-arrow-up-right" aria-hidden="true"></i
      ></a>
    </div>
    <app-case-gallery
      [cases]="cases()"
      [loading]="loading()"
      [errorMessage]="errorMessage()"
      [limit]="3"
      (retry)="loadCases()"
    />
  </section>

  <section
    appScrollReveal
    id="sobre"
    class="grid gap-5 border-t border-line py-12 sm:grid-cols-3 sm:py-16"
    aria-labelledby="about-title"
  >
    <h2 id="about-title" class="text-2xl font-semibold tracking-tight">Sobre</h2>
    <p class="max-w-2xl leading-relaxed text-muted sm:col-span-2">
      Sou Vinícius, desenvolvedor. Reúno aqui trabalhos, estudos e experimentos com código, jogos e
      interfaces.
    </p>
  </section>
</main>
