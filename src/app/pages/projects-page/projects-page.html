<main class="mx-auto min-h-[65vh] max-w-6xl px-6 py-12 sm:px-10 sm:py-16">
  <h1 class="text-4xl font-semibold tracking-tight sm:text-5xl">Projetos</h1>
  <nav class="my-8 flex flex-wrap gap-2" aria-label="Filtrar projetos por categoria">
    @for (category of categories(); track category) {
      <button
        pButton
        type="button"
        size="small"
        [outlined]="activeCategory() === category"
        [text]="activeCategory() !== category"
        [attr.aria-pressed]="activeCategory() === category"
        (click)="setCategory(category)"
      >
        <span pButtonLabel>{{ category }}</span>
      </button>
    }
  </nav>
  <app-case-gallery
    [cases]="visibleCases()"
    [loading]="loading()"
    [errorMessage]="errorMessage()"
    (retry)="loadCases()"
  />
</main>
