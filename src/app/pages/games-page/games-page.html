<main class="page-gutter games-page py-8 sm:py-12">
  <header class="games-heading">
    <h1 id="games-title">Jogos</h1>
    <p>Abra e jogue direto no navegador.</p>
  </header>

  <section aria-labelledby="games-title">
    <app-case-gallery
      variant="bento"
      [cases]="playableCases()"
      [loading]="loading()"
      [showPlayableBadge]="false"
      collectionLabel="jogos"
      itemLabel="jogo"
    />
    @if (errorMessage()) {
      <p class="games-notice" role="alert">
        Parte dos jogos não carregou.
        <button type="button" (click)="loadCases()">Tentar novamente</button>
      </p>
    }
  </section>
</main>
