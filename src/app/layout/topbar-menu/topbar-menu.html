<header
  class="page-gutter flex min-h-[4.5rem] flex-wrap items-center justify-between gap-x-8 gap-y-3 bg-[var(--hero-paper)] py-3"
>
  <a class="inline-flex min-h-11 items-center gap-2.5 text-copy no-underline" routerLink="/home" aria-label="AmberLink, início">
    <img class="size-7 rounded-full object-cover" src="/amberlink/amber-stone.webp" alt="" width="28" height="28" />
    <span class="font-display text-[1.875rem] leading-none">AmberLink</span>
  </a>
  <nav class="flex items-center gap-1 text-[0.9375rem]" aria-label="Navegação principal">
    <a
      class="inline-flex min-h-11 items-center rounded-full px-4 text-muted no-underline transition-colors hover:text-copy"
      routerLink="/projects"
      routerLinkActive="!text-copy"
      ariaCurrentWhenActive="page"
      >Projetos</a
    >
    <a
      class="inline-flex min-h-11 items-center rounded-full px-4 text-muted no-underline transition-colors hover:text-copy"
      routerLink="/articles"
      routerLinkActive="!text-copy"
      ariaCurrentWhenActive="page"
      >Artigos</a
    >
    <a
      class="ml-2 inline-flex min-h-11 items-center rounded-full border-[1.5px] border-[var(--ink)] px-5 text-copy no-underline transition-colors hover:bg-amber-soft"
      routerLink="/contact"
      routerLinkActive="bg-amber-soft"
      ariaCurrentWhenActive="page"
      >Contato</a
    >
  </nav>
</header>
